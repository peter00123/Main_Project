# =============================================================================
# FILE: gradle/wrapper/gradle-wrapper.properties
# =============================================================================
# OBJECTIVE:
#   Pins the Gradle distribution version used to build the project.
#   Gradle 8.2 is compatible with Android Gradle Plugin 8.2.2.
#   The distributionUrl points to the official Gradle CDN so the wrapper
#   auto-downloads the correct version on first build.
# =============================================================================

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
