# =============================================================================
# FILE: gradle.properties
# =============================================================================
# INDEX OF CONTENTS:
#   1. AndroidX enablement
#   2. Kotlin DSL settings
#   3. JVM heap configuration
#
# OBJECTIVE:
#   Specifies project-wide settings for the Gradle build system.
#   Crucially, it enables AndroidX (replacing legacy support libraries)
#   and Jetifier (automatic migration of third-party libraries).
# =============================================================================

# Enables AndroidX (required for modern libraries like Material 3)
android.useAndroidX=true

# Automatically converts third-party libraries to use AndroidX
android.enableJetifier=true

# JVM arguments (increases heap size for faster builds)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use parallel project execution
org.gradle.parallel=true

# Enable Kotlin incremental compilation
kotlin.incremental=true
