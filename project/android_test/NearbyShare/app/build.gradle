// =============================================================================
// FILE: app/build.gradle
// =============================================================================
// INDEX OF CONTENTS:
//   1. Plugin applications (Android, Kotlin, Hilt, Parcelize)
//   2. Android configuration block (compileSdk, minSdk, defaultConfig, etc.)
//   3. Build types (debug / release)
//   4. Java / Kotlin compile options
//   5. ViewBinding & BuildConfig enablement
//   6. Dependencies (AndroidX, Material, Hilt, Coroutines, Lifecycle, etc.)
//
// OBJECTIVE:
//   Module-level Gradle file for the :app module.
//   Sets Android SDK targets (minSdk 23 for broad device support),
//   enables ViewBinding for type-safe layout access, configures Hilt for
//   dependency injection, and declares all third-party libraries needed
//   to replicate the Nearby Share experience.
// =============================================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'           // Enables @Parcelize for data models
    id 'kotlin-kapt'                // Annotation processing (Hilt, Room)
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.nearbyshare'
    compileSdk 34

    defaultConfig {
        applicationId "com.nearbyshare"

        // minSdk 23 = Android 6.0 (Marshmallow) → covers ~95%+ of active devices
        minSdk 23
        targetSdk 34

        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true   // Generates binding classes for every XML layout
        buildConfig true   // Allows BuildConfig.DEBUG access in code
    }
}

dependencies {
    // ── AndroidX Core & AppCompat ──────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ── Material Design 3 ─────────────────────────────────────────────────
    implementation 'com.google.android.material:material:1.11.0'

    // ── Lifecycle (ViewModel + LiveData + Coroutine scope) ────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ── Coroutines ────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ── Hilt (Dependency Injection) ───────────────────────────────────────
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'

    // ── Navigation Component ──────────────────────────────────────────────
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // ── Lottie (Animations for scanning/transfer) ─────────────────────────
    implementation 'com.airbnb.android:lottie:6.3.0'

    // ── Glide (Device avatar image loading) ───────────────────────────────
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // ── Testing ───────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Required for Hilt annotation processing
kapt {
    correctErrorTypes true
}
