# application.properties
# Main configuration for the Atezhare Spring Boot backend.
# Base path: /atezhare  (matches Android app's ApiConstants.BASE_URL)
# Default profile uses H2 in-memory database for development.
# For production, create application-prod.properties with MySQL settings.

# ===== Server =====
server.port=8080
# Context path — Android app calls http://<host>:8080/atezhare/<endpoint>
server.servlet.context-path=/atezhare

# ===== Database (H2 in-memory — dev) =====
spring.datasource.url=jdbc:h2:mem:atezhare_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (dev only — remove in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== File Upload =====
# Maximum individual file size and total request size for POST /files/upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# File storage directory — files saved here temporarily until receiver downloads
# Change to an absolute path in production (e.g., /var/atezhare/uploads)
atezhare.file.upload-dir=./uploads

# ===== JWT =====
# Secret key for signing JWTs — replace with a long random string in production
atezhare.jwt.secret=atezhare-super-secret-jwt-key-change-this-in-production-min-256-bits
# Token expiry: 24 hours in milliseconds
atezhare.jwt.expiration=86400000

# ===== Session =====
# How long a share session stays valid (minutes) before auto-expiry
atezhare.session.expiry-minutes=30
# Length of the 6-digit pairing code (do not change without updating Android app)
atezhare.session.code-length=6

# ===== Logging =====
logging.level.com.atezhare=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
